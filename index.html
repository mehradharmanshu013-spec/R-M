<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google-site-verification" content="qKQtqJ8LGwJz9q9tBzVhNQzMVPClgxVc3poWkqoZM3g">
<title>Quote Status Dashboard | VD Work</title>
<meta name="description" content="VD Work Quote Status Dashboard for tracking quotations, approvals, purchase orders, work progress, billing status and payments across locations.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="googlebot" content="index, follow">
<meta name="author" content="VD Work">
<meta name="application-name" content="VD Work Quote Status Dashboard">
<meta name="theme-color" content="#0f172a">
<link rel="canonical" href="https://r-m-zeta.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VD Work">
<meta property="og:title" content="Quote Status Dashboard | VD Work">
<meta property="og:description" content="Track quotations, approvals, purchase orders, work progress, billing and payments in the VD Work dashboard.">
<meta property="og:url" content="https://r-m-zeta.vercel.app/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Quote Status Dashboard | VD Work">
<meta name="twitter:description" content="Track quotation status, approvals, purchase orders, work, billing and payments.">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "VD Work Quote Status Dashboard",
  "url": "https://r-m-zeta.vercel.app/",
  "description": "A dashboard for tracking quotations, approvals, purchase orders, work progress, billing and payments.",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Web"
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="quote-dashboard">
<div id="vw" role="dialog" aria-modal="true" aria-label="Document viewer"><div class="bx"><div class="tp"><div style="margin:0"><b id="vt"></b><div id="vc"></div></div><div class="ac"><button id="vx">Close</button></div></div><div id="vf"></div></div></div>
<div class="wrap">
<header><div><h1>Quote Status Dashboard</h1><div class="sub">VD Work · quotations, approvals, POs, work, billing &amp; payments</div></div>
<div style="display:flex;gap:8px"><button class="ghost" id="reset">Reset filters</button><button class="ghost" id="th" title="Switch light / dark">◐</button></div></header>
<button class="ghost" id="ft" data-action="toggle-filters">⚙ Filters</button>
<div class="card filters">
<label>Search<input id="q" placeholder="Branch, qtn no, PO…"></label>
<label>Status<select id="fStage"></select></label>
<label>Location<select id="fLoc"></select></label>
<label>Type<select id="fType"></select></label>
<label>Work<select id="fWork"></select></label>
<label>Billing<select id="fBill"><option value="">All billing</option><option value="none">Not billed</option><option value="In process">Bill in process</option><option value="Pending">Bill pending</option></select></label>
<label>Payment<select id="fPay"><option value="">All payments</option><option value="Y">Paid</option><option value="U">Billed, not paid</option></select></label>
<label>Quote from<input type="date" id="dFrom"></label>
<label>Quote to<input type="date" id="dTo"></label>
</div>
<div class="tabs" id="mo"></div>
<div class="twrap" id="kpis"></div>
<div class="grid">
<div class="card g4"><h2>Value by status</h2><div class="ch"><canvas id="cStage"></canvas></div></div>
<div class="card g8"><h2>Value by location</h2><div class="ch"><canvas id="cLoc"></canvas></div></div>
<div class="card g8"><h2>Quotation value by date</h2><div class="ch"><canvas id="cTime"></canvas></div></div>
<div class="card g4"><h2>Work &amp; billing status (value, # quotes)</h2><div class="ch"><canvas id="cFunnel"></canvas></div></div>
</div>
<div class="card"><h2>Quotations <span id="cnt" style="color:var(--muted);font-weight:400"></span></h2>
<div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="cards" id="cards"></div></div>
</div>
<script src="app.js" defer></script>
</div>
</body>
</html>
